# Suite registry for tools/check_inventory.py (docs/20 §5.1). A docs/19 test reference is "suite:name".
# column: which docs/19 status column the suite evidences (f = engine, mcp, web, formats = eve-fit-formats crate).
# The fmt* suites (bench formats-suite, CONTRACT-FORMATS 0.1) score the formats layer through `eve-fit serve-stdio`
# (EX-CT/eve-dogma crates/eve-fit-formats, outside the engine since the 2026-10-03 crate split), so they evidence `formats`.
# kind:   files       -> name (glob allowed, must match >=1) is a file stem in <dir> (git_ref: read via `git ls-tree`
#                        in the bench repo unless --root SUITE=PATH gives a checkout whose <dir> is used)
#         jsonl       -> name (glob) equals field <key> of some line of <file> (git_ref as for files)
#         rust-test   -> crate::path::test_fn; needs --root SUITE=PATH (Rust workspace); matches `fn <last>` in a
#                        .rs file under PATH (crate dir = first segment, '-' or '_', when it exists)
#         id          -> stable test id (exact); needs --root SUITE=PATH; ids are parsed from files under PATH matching
#                        `glob`: `<id_prefix><slug>:` at the start of a string literal (JS `${v}` parts expanded from a
#                        `for (const v of NAME)` over a literal array); optional `ids_json` cross-checked (warnings).
#                        An id that is not found is a failure (unknown-id).
#         string      -> DEPRECATED (unused since 1.11): quoted test title, substring match in files matching `glob`
schema: inventory-suites/1
suites:
  bench:     {column: f, kind: files, dir: cases, ext: .json}            # bench core (this branch / main)
  state:     {column: f, kind: files, dir: pending/state, ext: .json}
  effects:   {column: f, kind: files, dir: effects/cases, ext: .json}    # 1.10 effect suite (P0-2)
  ext:       {column: f, kind: files, dir: ext/cases, ext: .json}        # 1.10 stats-ext / heat / fleet.buffs / overrides
  ext-rpc:   {column: f, kind: files, dir: ext/rpc/cases, ext: .json}    # 1.11 draft lookups (JSON-RPC, Pyfa service layer: oracle/pyfa_lookup.py; ext/tools/score_rpc.py)
  ext-unit:  {column: f, kind: files, dir: ext/unit/cases, ext: .json}   # 1.11 hand-derived (non-Pyfa) overrides / validity unit cases
  cap:       {column: f, kind: files, git_ref: origin/cap-suite, dir: cap/cases, ext: .json}
  mut:       {column: f, kind: files, git_ref: origin/mutated-suite, dir: mutated/cases, ext: .json}
  fmt:       {column: formats, kind: files, git_ref: origin/formats-suite, dir: formats/edge, ext: ""}
  fmt-export: {column: formats, kind: jsonl, git_ref: origin/formats-suite, file: formats/expected/export.jsonl, key: format}
  fmt-edge:  {column: formats, kind: jsonl, git_ref: origin/formats-suite, file: formats/expected/edge.jsonl, key: category}
  graphs:    {column: f, kind: files, git_ref: origin/graphs-round2, dir: graphs/cases, ext: .json}
  unit:      {column: f, kind: rust-test}
  batch:     {column: f, kind: files, dir: batch/cases, ext: .json}   # docs/23 batch suite (batch/run_batch.py; identity vs one-by-one calc + price block)
  # mcp-* = the bench suites driven through eve-fit-mcp's compute_fit (detail=full) by tools/mcp_batch.py (bench-side, not
  # in the MCP's CI); results-1.11/mcp-8c6b93d-F2da8150.md (eve-fit-mcp 8c6b93d, EVE_DOGMA_BIN = eve-dogma 2da8150); re-run on v0.3.1 e7b794a: results-1.11/mcp-v0.3.1.md (engine d990818 and 2da8150); v0.4.0 d3786eb + pinned engine 197223f: results-1.11/mcp-v0.4.0.md
  mcp-bench: {column: mcp, kind: files, dir: cases, ext: .json}
  mcp-ext:   {column: mcp, kind: files, dir: ext/cases, ext: .json}
  mcp-ext-unit: {column: mcp, kind: files, dir: ext/unit/cases, ext: .json}
  mcp-cap:   {column: mcp, kind: files, git_ref: origin/cap-suite, dir: cap/cases, ext: .json}
  mcp-graphs: {column: mcp, kind: files, git_ref: origin/graphs-round2, dir: graphs/cases, ext: .json,   # graphs suite through compute_graph (tools/mcp_batch.py --tool compute_graph)
    na: {err_missing_x: "MCP auto-fills defaults (x axis) before the engine; n/a for MCP (eve 2026-10-03)",
         err_missing_x_values: "MCP auto-fills defaults (default x range) before the engine; n/a for MCP (eve 2026-10-03)",
         err_missing_y: "MCP auto-fills defaults (y series) before the engine; n/a for MCP (eve 2026-10-03)"}}
  mcp-effects: {column: mcp, kind: files, dir: effects/cases, ext: .json}   # effects suite through compute_fit (include_attributes)
  mcp-batch: {column: mcp, kind: files, dir: batch/cases, ext: .json}   # batch suite through compute_batch (tools/mcp_batch.py --tool compute_batch, run_batch.py --transport cli)
  mcp-mut:   {column: mcp, kind: files, git_ref: origin/mutated-suite, dir: mutated/cases, ext: .json}
  mcp:       {column: mcp, kind: id, id_prefix: "mcp.", glob: "*.test.ts", ids_json: docs/test-ids.json}   # --root mcp=<EX-CT/eve-fit-mcp checkout, = v0.4.0 d3786eb (docs/test-ids.json 89 ids, 36 with inventory refs)>: ids mcp.<file>.<slug> on the node --test titles in src/test/ (guard: mcp.unit.test-ids; table docs/test-ids.{md,json})
  # web-* (bench-suites run): eve-fit-web CI runs the pending-1.11 suites at c2229b2 in headless Chrome through the site's F wasm worker
  # (tools/browser-engine.mjs; F = eve-dogma 20aa425 per engines.lock ENGINE_F_SRC), run 37104154159 (eve-fit-web fdbb014, 2026-10-03
  # 14:46 CST), artifact bench-suites-wasm-worker; per-case results verified in results-1.11/web-fdbb014.md; gate baselines/web.json
  web-bench: {column: web, kind: files, git_ref: c2229b2194b21a8b73a4fd394704203f25d45816, dir: cases, ext: .json}   # core 339/339 (was the bench 1.9.0 corpus, tools/browser-dogma-bench.py)
  web-ext:   {column: web, kind: files, git_ref: c2229b2194b21a8b73a4fd394704203f25d45816, dir: ext/cases, ext: .json}   # ext 207/239
  web-ext-unit: {column: web, kind: files, git_ref: c2229b2194b21a8b73a4fd394704203f25d45816, dir: ext/unit/cases, ext: .json}
  web-effects: {column: web, kind: files, git_ref: c2229b2194b21a8b73a4fd394704203f25d45816, dir: effects/cases, ext: .json}   # 2353/2378
  web-cap:   {column: web, kind: files, git_ref: d80cc38093416bda0f2f271a5f3b439c45648f1b, dir: cap/cases, ext: .json}   # 150/150
  web-mut:   {column: web, kind: files, git_ref: 4533dde70a624a0850bdf43ead198b42d99c5832, dir: mutated/cases, ext: .json}   # 93/93
  web-graphs: {column: web, kind: files, git_ref: db81b8c565c86fae5964b76db7932a0cbf177edb, dir: graphs/cases, ext: .json}   # graphs-v0.3 192/192 in the bench-suites run (was graphs 0.2 8c40921 in the Pages CI)
  web-e2e:   {column: web, kind: id, id_prefix: "web.e2e.", glob: "e2e*.mjs"}   # --root web-e2e=<EX-CT/eve-fit-web checkout, >= fafa982>: check ids web.e2e.<slug> in tools/e2e.mjs; only the ts-worker and default-engine e2e runs block a release (other engines are informational)
  web-unit:  {column: web, kind: id, id_prefix: "web.unit.", glob: "*.test.ts"}   # --root web-unit=<EX-CT/eve-fit-web checkout, >= 40e6044>: vitest names web.unit.<slug> in src/**/*.test.ts (npm test in Pages CI, REQUIRE_FORMATS_WASM=1)
  formats-rust: {column: formats, kind: rust-test}   # --root formats-rust=<EX-CT/eve-dogma checkout>: Rust tests touching eve-fit-formats (crates/eve-fit-formats has none of its own at 2da8150; eve-cli/tests/formats_static_fit.rs)
